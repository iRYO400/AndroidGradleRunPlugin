name: Release

# Push a tag like `v0.7.0` to build the plugin and publish it to GitHub Releases.
# The version is taken from the tag (the leading `v` is stripped) and passed to
# Gradle via -PpluginVersion, so the ZIP always matches the tag — no drift with
# gradle.properties. Can also be run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to build (e.g. 0.7.0). Defaults to gradle.properties.'
        required: false
        default: ''

permissions:
  contents: write  # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4  # caches ~/.gradle (incl. the downloaded Android Studio platform)

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Test & build plugin
        run: ./gradlew test buildPlugin -PpluginVersion=${{ steps.version.outputs.version }} --no-configuration-cache

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: build/distributions/*.zip
